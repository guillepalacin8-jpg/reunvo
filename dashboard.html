<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reunvo — Panel de cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy:        #1B2E44;
      --navy-mid:    #243A57;
      --gold:        #9A7B5B;
      --gold-light:  #B59268;
      --cream:       #F7F4F0;
      --surface:     #FFFFFF;
      --muted:       #6B7280;
      --border:      rgba(154, 123, 91, 0.18);
      --ok:          #1E7A57;
      --ok-bg:       #EDFAF3;
      --warn:        #B45309;
      --warn-bg:     #FFFBEB;
      --err:         #B91C1C;
      --err-bg:      #FEF2F2;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--cream);
      color: var(--navy);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      background: var(--navy);
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 500;
      color: #fff;
      letter-spacing: .06em;
      user-select: none;
    }
    .logo em { color: var(--gold); font-style: normal; }

    .header-right { text-align: right; }
    .header-client {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,.9);
      line-height: 1.2;
    }
    .header-label {
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
      margin-bottom: 2px;
    }

    /* ── Layout ── */
    main {
      max-width: 1060px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── Section header ── */
    .section { margin-bottom: 44px; }

    h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: .02em;
      color: var(--navy);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h2::before {
      content: '';
      display: inline-block;
      width: 3px;
      height: 18px;
      background: var(--gold);
      border-radius: 2px;
    }

    /* ── Status card ── */
    .status-card {
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      transition: border-color .2s;
    }
    .status-card.ok          { border-left: 4px solid var(--ok);   background: var(--ok-bg); }
    .status-card.warn        { border-left: 4px solid var(--warn);  background: var(--warn-bg); }
    .status-card.err         { border-left: 4px solid var(--err);   background: var(--err-bg); }

    .status-body { display: flex; align-items: center; gap: 14px; }
    .status-emoji { font-size: 22px; line-height: 1; }

    .status-title {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.3;
    }
    .status-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
    }

    /* ── Buttons ── */
    .btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 20px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }

    .btn-navy   { background: var(--navy);  color: #fff; }
    .btn-navy:hover { opacity: .88; }

    .btn-warn   { background: var(--warn);  color: #fff; }
    .btn-warn:hover { opacity: .88; }

    /* ── Metrics grid ── */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .metric-card {
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 28px 30px 24px;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .metric-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 60px;
      font-weight: 300;
      color: var(--navy);
      line-height: 1;
    }

    .metric-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ── Table ── */
    .table-wrap {
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead { background: var(--navy); }

    th {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: rgba(255,255,255,.55);
      padding: 13px 20px;
      text-align: left;
    }

    td {
      padding: 13px 20px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .1s; }
    tbody tr:hover td { background: #FAF7F3; }

    .col-company { font-weight: 500; min-width: 180px; }
    .col-subject {
      color: var(--muted);
      max-width: 380px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .col-date { color: var(--muted); white-space: nowrap; font-size: 13px; }

    .empty-cell {
      text-align: center;
      color: var(--muted);
      padding: 48px 20px !important;
      font-size: 14px;
    }

    /* ── Skeleton shimmer ── */
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .shimmer {
      display: inline-block;
      height: 14px;
      border-radius: 4px;
      background: linear-gradient(90deg, #EEEBE5 25%, #E4E0D9 50%, #EEEBE5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    /* ── Global error banner ── */
    .global-error {
      background: var(--err-bg);
      border: 1px solid #FCA5A5;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 14px;
      color: var(--err);
      margin-bottom: 28px;
      display: none;
    }

    /* ── Divider ── */
    .gold-rule {
      height: 1px;
      background: linear-gradient(90deg, var(--gold) 0%, transparent 80%);
      margin: 0 0 44px;
      opacity: .4;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header { padding: 0 20px; }
      main   { padding: 32px 16px 60px; }
      .metrics-grid { grid-template-columns: 1fr; }
      .metric-value { font-size: 48px; }
      .status-card { flex-direction: column; align-items: flex-start; gap: 14px; }
    }
  </style>
</head>

<body>
  <!-- ── Header ─────────────────────────────────────────────────── -->
  <header>
    <div class="logo">R<em>eu</em>nvo</div>
    <div class="header-right">
      <div class="header-label">Cliente</div>
      <div class="header-client" id="js-client-name">
        <span class="shimmer" style="width:140px"></span>
      </div>
    </div>
  </header>

  <!-- ── Main ──────────────────────────────────────────────────── -->
  <main>
    <div class="global-error" id="js-error"></div>

    <!-- Conexión Gmail -->
    <section class="section">
      <h2>Conexión Gmail</h2>
      <div class="status-card" id="js-status-card">
        <div class="status-body">
          <span class="status-emoji" id="js-status-icon">⏳</span>
          <div>
            <div class="status-title" id="js-status-title">Verificando…</div>
            <div class="status-sub"  id="js-status-sub"></div>
          </div>
        </div>
        <div id="js-status-action"></div>
      </div>
    </section>

    <div class="gold-rule"></div>

    <!-- Métricas -->
    <section class="section">
      <h2>Actividad</h2>
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-label">Drafts este mes</div>
          <div class="metric-value" id="js-count-month">
            <span class="shimmer" style="width:60px;height:50px"></span>
          </div>
          <div class="metric-sub" id="js-label-month"></div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Drafts hoy</div>
          <div class="metric-value" id="js-count-today">
            <span class="shimmer" style="width:60px;height:50px"></span>
          </div>
          <div class="metric-sub" id="js-label-today"></div>
        </div>
      </div>
    </section>

    <div class="gold-rule"></div>

    <!-- Últimas empresas contactadas -->
    <section class="section">
      <h2>Últimas empresas contactadas</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Empresa</th>
              <th>Asunto del email</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody id="js-campaigns">
            <tr><td class="empty-cell" colspan="3">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ── Script ────────────────────────────────────────────────── -->
  <script>
    // ── Config ─────────────────────────────────────────────────────────────
    // IMPORTANTE: usa la *anon key* (Settings → API → anon public), NO la service-role key.
    const SUPABASE_URL     = 'https://quywrltqzoyyorbsuiwc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1eXdybHRxem95eW9yYnN1aXdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0MDYzMTQsImV4cCI6MjA4NTk4MjMxNH0.pTHmfCBFMFBCHiCNnRKjrFfBQiCVaOG5tkrTJYhAXI0';
    const N8N_AUTH_BASE    = 'https://guillepalacin1.app.n8n.cloud/webhook/auth/start';

    // ── Helpers ─────────────────────────────────────────────────────────────
    const params   = new URLSearchParams(window.location.search);
    const clientId = params.get('client_id');

    const BASE_HEADERS = {
      apikey:          SUPABASE_ANON_KEY,
      Authorization:   `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type':  'application/json',
      Accept:          'application/json',
    };

    async function sbGet(table, qs = {}) {
      const url = new URL(`${SUPABASE_URL}/rest/v1/${table}`);
      Object.entries(qs).forEach(([k, v]) => url.searchParams.set(k, v));
      const res = await fetch(url.toString(), { headers: BASE_HEADERS });
      if (!res.ok) throw new Error(`${table}: HTTP ${res.status}`);
      return res.json();
    }

    async function sbCount(table, qs = {}) {
      const url = new URL(`${SUPABASE_URL}/rest/v1/${table}`);
      url.searchParams.set('select', 'id');
      Object.entries(qs).forEach(([k, v]) => url.searchParams.set(k, v));
      const res = await fetch(url.toString(), {
        headers: { ...BASE_HEADERS, Prefer: 'count=exact', Range: '0-0' },
      });
      // 206 Partial Content is expected when results exist
      if (res.status !== 206 && !res.ok) throw new Error(`count ${table}: HTTP ${res.status}`);
      const range = res.headers.get('content-range') || '*/0';
      return parseInt(range.split('/').pop(), 10) || 0;
    }

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString('es-ES', {
        day: '2-digit', month: 'short', year: 'numeric',
      });
    }

    // ── Render helpers ──────────────────────────────────────────────────────
    function setError(msg) {
      const el = document.getElementById('js-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function renderGmailStatus(token) {
      const card   = document.getElementById('js-status-card');
      const icon   = document.getElementById('js-status-icon');
      const title  = document.getElementById('js-status-title');
      const sub    = document.getElementById('js-status-sub');
      const action = document.getElementById('js-status-action');
      const authHref = `${N8N_AUTH_BASE}?client_id=${encodeURIComponent(clientId)}`;

      if (!token) {
        card.className  = 'status-card err';
        icon.textContent = '❌';
        title.textContent = 'Gmail no conectado';
        sub.textContent   = 'Conecta tu cuenta para empezar a enviar propuestas';
        action.innerHTML  = `<a href="${esc(authHref)}" class="btn btn-navy">Conectar Gmail</a>`;
        return;
      }

      const expired = token.expires_at && new Date(token.expires_at) < new Date();

      if (expired) {
        card.className  = 'status-card warn';
        icon.textContent = '⚠️';
        title.textContent = 'Token caducado — reconecta tu Gmail';
        sub.textContent   = esc(token.email || '');
        action.innerHTML  = `<a href="${esc(authHref)}" class="btn btn-warn">Reconectar Gmail</a>`;
      } else {
        card.className  = 'status-card ok';
        icon.textContent = '✅';
        title.textContent = 'Gmail conectado';
        sub.textContent   = esc(token.email || '');
      }
    }

    function renderCampaigns(rows) {
      const tbody = document.getElementById('js-campaigns');
      if (!rows?.length) {
        tbody.innerHTML = `<tr><td class="empty-cell" colspan="3">Aún no hay empresas contactadas</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td class="col-company">${esc(r.company_name)}</td>
          <td class="col-subject" title="${esc(r.email_subject)}">${esc(r.email_subject || '—')}</td>
          <td class="col-date">${r.created_at ? fmtDate(r.created_at) : '—'}</td>
        </tr>
      `).join('');
    }

    // ── Main ────────────────────────────────────────────────────────────────
    async function init() {
      if (!clientId) {
        setError('Enlace inválido: falta el parámetro client_id en la URL.');
        return;
      }

      const now           = new Date();
      const startOfMonth  = new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
      const startOfToday  = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
      const monthLabel    = now.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
      const todayLabel    = now.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

      document.getElementById('js-label-month').textContent = monthLabel;
      document.getElementById('js-label-today').textContent = todayLabel;

      try {
        // 1 — Client info
        const [client] = await sbGet('clients', {
          id:     `eq.${clientId}`,
          select: 'id,name,company_name',
          limit:  '1',
        });
        if (!client) {
          setError('Cliente no encontrado. Verifica que el enlace sea correcto.');
          document.getElementById('js-client-name').textContent = '';
          return;
        }
        document.getElementById('js-client-name').textContent =
          client.company_name || client.name || '';

        // 2 — Gmail token (serial: needed before render)
        const [token] = await sbGet('client_tokens', {
          client_id: `eq.${clientId}`,
          select:    'email,expires_at',
          limit:     '1',
        });
        renderGmailStatus(token ?? null);

        // 3 — Metrics + campaigns in parallel
        const [countMonth, countToday, campaigns] = await Promise.all([
          sbCount('campaigns', {
            client_id:  `eq.${clientId}`,
            created_at: `gte.${startOfMonth}`,
          }),
          sbCount('campaigns', {
            client_id:  `eq.${clientId}`,
            created_at: `gte.${startOfToday}`,
          }),
          sbGet('campaigns', {
            client_id: `eq.${clientId}`,
            select:    'company_name,email_subject,created_at',
            order:     'created_at.desc',
            limit:     '10',
          }),
        ]);

        document.getElementById('js-count-month').textContent = countMonth;
        document.getElementById('js-count-today').textContent = countToday;
        renderCampaigns(campaigns);

      } catch (err) {
        console.error(err);
        setError(`Error al cargar los datos: ${err.message}`);
      }
    }

    init();
  </script>
</body>
</html>
