<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reunvo · Revisión</title>
<script>
/* La cola de revisión vive ahora DENTRO de panel_admin.html, como pestaña.
   Esta página solo redirige, para que los enlaces antiguos y los correos ya
   enviados sigan funcionando. Se conserva el #k= si viene en la URL.
   Motivo: dos pantallas internas con la misma contraseña era el mismo lío de
   nombres que ya costó caro con los cuatro paneles. */
(function(){
  var h = location.hash || '';
  try { localStorage.setItem('reunvo_admin_vista','revision'); } catch(e) {}
  location.replace('/panel_admin.html' + h);
})();
</script>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
             background:#f4f6f9;color:#6b7688;padding:40px;text-align:center">
  <p>La revisión está ahora dentro del panel de control.</p>
  <p><a href="/panel_admin.html" style="color:#1a3c6e">Ir al panel</a></p>
</body>
</html>
