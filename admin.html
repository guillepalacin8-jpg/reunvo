<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reunvo — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #1B2E44;
      --navy-light: #243a56;
      --navy-dark:  #131f2e;
      --gold:       #9A7B5B;
      --gold-light: #b8966e;
      --gold-faint: rgba(154, 123, 91, 0.12);
      --text:       #e6e2dc;
      --text-muted: #8a8680;
      --border:     rgba(154, 123, 91, 0.18);
      --border-sub: rgba(255, 255, 255, 0.05);
      --ok:         #4caf89;
      --warn:       #e8a93a;
      --err:        #d95f5f;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--navy-dark);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--navy);
      border-bottom: 1px solid var(--border);
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 500;
      color: var(--gold-light);
      letter-spacing: 0.04em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    #clock {
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .btn-refresh {
      background: none;
      border: 1px solid var(--border);
      color: var(--gold);
      padding: 7px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      transition: background 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-refresh:hover { background: var(--gold-faint); border-color: var(--gold); }
    .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }

    .spin { display: inline-block; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Main ── */
    main {
      max-width: 1480px;
      margin: 0 auto;
      padding: 36px 40px 60px;
    }

    /* ── Metrics ── */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }

    .metric-card {
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 24px;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }

    .metric-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      font-weight: 400;
      line-height: 1;
      color: var(--gold-light);
    }

    .metric-value.danger { color: var(--err); }

    .metric-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* ── Section header ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    #client-count {
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.05);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* ── Table ── */
    .table-wrapper {
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      padding: 13px 18px;
      text-align: left;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.18);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border-sub);
      transition: background 0.12s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--gold-faint); }

    td {
      padding: 15px 18px;
      font-size: 13.5px;
      vertical-align: middle;
    }

    /* client name + company */
    .client-name {
      font-weight: 500;
      color: var(--text);
      font-size: 14px;
    }

    .client-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* email */
    .cell-email {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    /* gmail status */
    .gmail-icon { font-size: 18px; line-height: 1; display: block; }
    .gmail-sub  { font-size: 10.5px; color: var(--text-muted); margin-top: 3px; display: block; }

    /* draft counts */
    .count {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 400;
      color: var(--gold-light);
      line-height: 1;
    }

    .count.zero { color: var(--text-muted); }

    /* error log */
    .error-text {
      font-size: 11.5px;
      color: var(--err);
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: help;
    }

    .no-error { font-size: 12px; color: var(--text-muted); }

    /* status badge */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 500;
      white-space: nowrap;
    }

    .badge-active   { background: rgba(76,175,137,0.12); color: var(--ok);   border: 1px solid rgba(76,175,137,0.3); }
    .badge-inactive { background: rgba(154,148,144,0.1); color: var(--text-muted); border: 1px solid rgba(154,148,144,0.2); }
    .badge-pending  { background: rgba(232,169,58,0.1);  color: var(--warn); border: 1px solid rgba(232,169,58,0.25); }

    /* copy button */
    .btn-copy {
      background: none;
      border: 1px solid var(--border);
      color: var(--gold);
      padding: 6px 13px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn-copy:hover { background: var(--gold-faint); border-color: var(--gold); }
    .btn-copy.ok    { color: var(--ok); border-color: rgba(76,175,137,0.4); }

    /* ── State placeholders ── */
    .state-box {
      text-align: center;
      padding: 60px 24px;
    }

    .state-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }

    .state-label {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .state-error-label {
      font-size: 14px;
      color: var(--err);
      margin-bottom: 6px;
    }

    .state-error-detail {
      font-size: 12px;
      color: var(--text-muted);
      font-family: monospace;
      max-width: 600px;
      margin: 0 auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* ── Footer ── */
    .footer {
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: right;
      margin-top: 18px;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--navy-light);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 100;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<header>
  <div class="header-title">Reunvo — Admin</div>
  <div class="header-right">
    <span id="clock"></span>
    <button class="btn-refresh" id="btn-refresh" onclick="loadData()">
      <span id="refresh-icon">↻</span> Actualizar
    </button>
  </div>
</header>

<main>

  <!-- Global metrics -->
  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-label">Clientes activos</div>
      <div class="metric-value" id="m-active">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Drafts hoy</div>
      <div class="metric-value" id="m-today">—</div>
      <div class="metric-sub">todos los clientes</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Drafts este mes</div>
      <div class="metric-value" id="m-month">—</div>
      <div class="metric-sub">todos los clientes</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Gmail sin conectar</div>
      <div class="metric-value danger" id="m-nogmail">—</div>
      <div class="metric-sub">caducado o no conectado</div>
    </div>
  </div>

  <!-- Clients table -->
  <div class="section-header">
    <span class="section-title">Clientes</span>
    <span id="client-count"></span>
  </div>

  <div class="table-wrapper">
    <div id="table-root">
      <div class="state-box">
        <div class="state-spinner"></div>
        <div class="state-label">Cargando…</div>
      </div>
    </div>
  </div>

  <div class="footer" id="footer"></div>

</main>

<div id="toast"></div>

<script>
  // ── Config ───────────────────────────────────────────────────────────
  const SUPA_URL = 'https://quywrltqzoyyorbsuiwc.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1eXdybHRxem95eW9yYnN1aXdjIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3MDQwNjMxNCwiZXhwIjoyMDg1OTgyMzE0fQ.Q-7Khq1jBKRIhdq1s9_JgDMi4N61CjIsqV1b2RNahoA';
  const N8N_OAUTH_BASE = 'https://guillepalacin1.app.n8n.cloud/webhook/auth/start';

  // ── Supabase fetch ───────────────────────────────────────────────────
  async function supa(path) {
    const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, {
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': `Bearer ${SUPA_KEY}`,
        'Content-Type': 'application/json'
      }
    });
    if (!res.ok) {
      const body = await res.text();
      throw new Error(`[${res.status}] ${body}`);
    }
    return res.json();
  }

  // ── Date helpers ─────────────────────────────────────────────────────
  function isoToday() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T00:00:00`;
  }

  function isoStartOfMonth() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-01T00:00:00`;
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  // ── Gmail status ─────────────────────────────────────────────────────
  function gmailStatus(token) {
    if (!token) return { icon: '❌', label: 'No conectado', ok: false };
    const expField = token.token_expiry ?? token.expiry_at ?? token.expires_at ?? token.expiry;
    if (!expField) return { icon: '⚠️', label: 'Sin fecha', ok: false };
    return new Date(expField) > new Date()
      ? { icon: '✅', label: 'Activo',    ok: true  }
      : { icon: '⚠️', label: 'Caducado', ok: false };
  }

  // ── Status badge ─────────────────────────────────────────────────────
  function statusBadge(raw) {
    const s = (raw || '').toLowerCase();
    if (s === 'active')   return `<span class="badge badge-active">Activo</span>`;
    if (s === 'inactive') return `<span class="badge badge-inactive">Inactivo</span>`;
    if (s === 'pending')  return `<span class="badge badge-pending">Pendiente</span>`;
    return `<span class="badge badge-inactive">${esc(raw || '—')}</span>`;
  }

  // ── HTML escape ──────────────────────────────────────────────────────
  function esc(v) {
    return String(v ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Toast ─────────────────────────────────────────────────────────────
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // ── Copy OAuth link ──────────────────────────────────────────────────
  function copyOAuth(btn) {
    const url = btn.dataset.url;
    navigator.clipboard.writeText(url).then(() => {
      btn.textContent = '✓ Copiado';
      btn.classList.add('ok');
      toast('Link copiado al portapapeles');
      setTimeout(() => {
        btn.textContent = 'Copiar link OAuth';
        btn.classList.remove('ok');
      }, 2200);
    }).catch(() => {
      // fallback for older browsers
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      toast('Link copiado');
    });
  }

  // ── Main load ────────────────────────────────────────────────────────
  async function loadData() {
    const btn = document.getElementById('btn-refresh');
    const icon = document.getElementById('refresh-icon');
    btn.disabled = true;
    icon.className = 'spin';
    icon.textContent = '↻';

    document.getElementById('table-root').innerHTML = `
      <div class="state-box">
        <div class="state-spinner"></div>
        <div class="state-label">Cargando…</div>
      </div>`;

    try {
      const todayISO      = isoToday();
      const startMonthISO = isoStartOfMonth();

      // Fire all requests in parallel
      const [clients, tokens, campaignsMonth] = await Promise.all([
        supa('clients?select=*&order=created_at.asc'),
        supa('client_tokens?select=*'),
        supa(`campaigns?select=client_id,created_at,error_log&created_at=gte.${startMonthISO}&order=created_at.desc&limit=5000`)
      ]);

      // Index tokens by client_id
      const tokenMap = {};
      for (const t of tokens) tokenMap[t.client_id] = t;

      // Aggregate campaigns
      const draftsToday = {};
      const draftsMonth = {};
      const lastError   = {};

      for (const c of campaignsMonth) {
        const cid = c.client_id;
        if (!cid) continue;
        draftsMonth[cid] = (draftsMonth[cid] || 0) + 1;
        if (c.created_at >= todayISO) draftsToday[cid] = (draftsToday[cid] || 0) + 1;
        if (c.error_log && !lastError[cid]) lastError[cid] = c.error_log;
      }

      // Global metrics
      const activeClients = clients.filter(c => (c.status || '').toLowerCase() === 'active').length;
      const totalToday    = Object.values(draftsToday).reduce((a, b) => a + b, 0);
      const totalMonth    = Object.values(draftsMonth).reduce((a, b) => a + b, 0);
      const noGmail       = clients.filter(c => !gmailStatus(tokenMap[c.id]).ok).length;

      document.getElementById('m-active').textContent = activeClients;
      document.getElementById('m-today').textContent  = totalToday;
      document.getElementById('m-month').textContent  = totalMonth;
      document.getElementById('m-nogmail').textContent = noGmail;

      document.getElementById('client-count').textContent = `${clients.length} clientes`;

      // Build table rows
      if (!clients.length) {
        document.getElementById('table-root').innerHTML = `
          <div class="state-box">
            <div class="state-label">No hay clientes en la base de datos.</div>
          </div>`;
        return;
      }

      const rows = clients.map(c => {
        // Resolve field names flexibly
        const name    = c.name || c.client_name || c.nombre || '—';
        const company = c.company || c.empresa || c.company_name || '';
        const email   = c.email || '—';
        const gmail   = gmailStatus(tokenMap[c.id]);
        const dToday  = draftsToday[c.id] || 0;
        const dMonth  = draftsMonth[c.id] || 0;
        const errLog  = lastError[c.id] || null;
        const oauthUrl = `${N8N_OAUTH_BASE}?client_id=${encodeURIComponent(c.id)}`;

        return `<tr>
          <td>
            <div class="client-name">${esc(name)}</div>
            ${company ? `<div class="client-sub">${esc(company)}</div>` : ''}
          </td>
          <td><span class="cell-email">${esc(email)}</span></td>
          <td>
            <span class="gmail-icon">${gmail.icon}</span>
            <span class="gmail-sub">${gmail.label}</span>
          </td>
          <td><span class="count${dToday === 0 ? ' zero' : ''}">${dToday}</span></td>
          <td><span class="count${dMonth === 0 ? ' zero' : ''}">${dMonth}</span></td>
          <td>${errLog
            ? `<span class="error-text" title="${esc(errLog)}">${esc(errLog)}</span>`
            : `<span class="no-error">—</span>`}</td>
          <td>${statusBadge(c.status)}</td>
          <td>
            <button class="btn-copy" data-url="${esc(oauthUrl)}" onclick="copyOAuth(this)">
              Copiar link OAuth
            </button>
          </td>
        </tr>`;
      }).join('');

      document.getElementById('table-root').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Email</th>
              <th>Gmail</th>
              <th>Drafts hoy</th>
              <th>Drafts mes</th>
              <th>Último error</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;

      document.getElementById('footer').textContent =
        `Última actualización: ${new Date().toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'medium' })}`;

    } catch (err) {
      document.getElementById('table-root').innerHTML = `
        <div class="state-box">
          <div class="state-error-label">❌ Error al cargar datos</div>
          <div class="state-error-detail">${esc(err.message)}</div>
        </div>`;
      console.error(err);
    } finally {
      btn.disabled = false;
      icon.className = '';
      icon.textContent = '↻';
    }
  }

  // ── Clock ─────────────────────────────────────────────────────────────
  function tickClock() {
    document.getElementById('clock').textContent =
      new Date().toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'medium' });
  }

  tickClock();
  setInterval(tickClock, 1000);

  // ── Boot ──────────────────────────────────────────────────────────────
  loadData();
</script>
</body>
</html>
