<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Correo conectado — Reunvo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>

<header class="top">
  <a class="wordmark" href="bienvenida.html" data-keep-token>Reunvo<span>.</span></a>
</header>

<main class="wrap">
  <section data-app>
    <p class="eyebrow">Todo listo</p>
    <h1>Su correo está conectado.</h1>
    <p class="lead">Le avisaremos antes de empezar los envíos.</p>

    <a class="btn btn--block" href="panel_cliente.html" data-keep-token-qs>Ir a mi panel</a>

    <p class="contacto">¿Algo no encaja? <a href="mailto:gp@reunvo.com">gp@reunvo.com</a></p>
  </section>
</main>

<script src="assets/app.js"></script>
<script>
(() => {
  const t = getToken();
  propagarToken(t);
  propagarTokenQS(t);
  // Sin token (ni fragmento ni sessionStorage): el panel no puede identificar al cliente, así que vamos a entrar.html
  if (!t) document.querySelector('a[data-keep-token-qs]')?.setAttribute('href','entrar.html');
})();
</script>
</body>
</html>
